name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $tag = '${{ github.event.inputs.tag }}'
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage artifacts
        shell: pwsh
        run: |
          $stage = "stage/plugin_sysinfo-${{ steps.ver.outputs.tag }}-win-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/Release/plugin_sysinfo.dll" $stage
          Copy-Item "README.md" $stage
          Copy-Item "LICENSE"   $stage
          Get-FileHash -Algorithm SHA256 "$stage/plugin_sysinfo.dll" |
            ForEach-Object { "$($_.Hash.ToLower())  plugin_sysinfo.dll" } |
            Out-File -Encoding ascii "$stage/SHA256SUMS"
          Compress-Archive -Path "$stage/*" -DestinationPath "plugin_sysinfo-${{ steps.ver.outputs.tag }}-win-x64.zip"

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin_sysinfo-${{ steps.ver.outputs.tag }}-win-x64
          path: plugin_sysinfo-${{ steps.ver.outputs.tag }}-win-x64.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: plugin_sysinfo-${{ steps.ver.outputs.tag }}-win-x64.zip
          generate_release_notes: true
